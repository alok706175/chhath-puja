<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunBody" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd873"/>
      <stop offset="70%" stop-color="#ffb238"/>
      <stop offset="100%" stop-color="#f5730f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer glow -->
  <circle cx="256" cy="256" r="248" fill="url(#glow)"/>

  <!-- rays -->
  <g stroke="#ffb238" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="18"  x2="256" y2="78"/>
    <line x1="256" y1="434" x2="256" y2="494"/>
    <line x1="18"  y1="256" x2="78"  y2="256"/>
    <line x1="434" y1="256" x2="494" y2="256"/>
    <line x1="93"  y1="93"  x2="135" y2="135"/>
    <line x1="377" y1="377" x2="419" y2="419"/>
    <line x1="419" y1="93"  x2="377" y2="135"/>
    <line x1="135" y1="377" x2="93"  y2="419"/>
  </g>

  <!-- sun disc -->
  <circle cx="256" cy="256" r="140" fill="url(#sunBody)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#e8590c" stroke-width="4" opacity="0.4"/>
</svg>
