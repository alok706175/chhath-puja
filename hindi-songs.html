    /* =========================================================
       PURE BLACK & WHITE (MONOCHROME) THEME
       ========================================================= */
    :root {
      --bw-bg: #ffffff;
      --bw-surface: #ffffff;
      --bw-surface-subtle: #f4f4f5;
      --bw-surface-hover: #e4e4e7;
      --bw-border: #e4e4e7;
      --bw-border-dark: #18181b;
      --bw-text-primary: #000000;
      --bw-text-secondary: #52525b;
      --bw-text-muted: #71717a;
      --bw-black: #000000;
      --bw-white: #ffffff;
    }

    body {
      background-color: var(--bw-bg) !important;
      color: var(--bw-text-primary) !important;
      background-image: none !important;
    }

    .bg-layer {
      background-image: none !important;
      background: var(--bw-bg) !important;
      filter: none !important;
      transform: none !important;
      opacity: 1 !important;
    }

    .bg-overlay {
      display: none !important;
    }

    .festive-canvas {
      display: none !important;
    }

    @media (max-width: 1400px), (max-width: 1180px), (max-width: 860px), (max-width: 600px), (max-width: 400px) {
      body, .bg-layer, .bg-overlay {
        background-image: none !important;

    /* Top Navbar */
    .top-navbar-wrapper {
      background: rgba(255, 255, 255, 0.95) !important;
      border-bottom: 1px solid var(--bw-border) !important;
      backdrop-filter: blur(16px) !important;
    }

    .top-bar {
      background: transparent !important;
    }

    .time-widget {
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
      box-shadow: none !important;
    }

    .time-main {
      color: var(--bw-text-primary) !important;
      font-weight: 800 !important;
    }

    .date-sub {
      color: var(--bw-text-secondary) !important;
      border-left: 1px solid var(--bw-border) !important;
    }

    .btn-nav-item,
    .btn-lang-toggle,
    .btn-action {
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border) !important;
      color: var(--bw-text-primary) !important;
      box-shadow: none !important;
    }

    .btn-nav-item svg,
    .btn-action svg {
      stroke: var(--bw-text-primary) !important;
    }

    .btn-nav-item:hover,
    .btn-lang-toggle:hover,
    .btn-action:hover {
      background: var(--bw-black) !important;
      border-color: var(--bw-black) !important;
      color: var(--bw-white) !important;
    }

    .btn-nav-item:hover svg,
    .btn-action:hover svg {
      stroke: var(--bw-white) !important;
    }

    .btn-go-back {
      background: var(--bw-white) !important;
      border: 1.5px solid var(--bw-black) !important;
      color: var(--bw-black) !important;
      font-weight: 700 !important;
    }

    .btn-go-back svg {
      stroke: var(--bw-black) !important;
    }

    .btn-go-back:hover {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border-color: var(--bw-black) !important;
    }

    .btn-go-back:hover svg {
      stroke: var(--bw-white) !important;
    }

    /* Hero Logo & Tagline */
    .divine-sun-halo {
      display: none !important;
    }

    .logo-container {
      padding-top: clamp(14px, 3vh, 26px);
      margin-bottom: 18px;
    }

    .logo {
      color: var(--bw-black) !important;
      background: none !important;
      -webkit-text-fill-color: var(--bw-black) !important;
      text-shadow: none !important;
      filter: none !important;
      font-weight: 800 !important;
      letter-spacing: -0.5px;
    }

    .tagline-wrapper {
      margin-top: 10px;
      padding: 5px 18px;
      max-width: 95vw;
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
      box-shadow: none !important;
    }

    .tagline {
      font-size: clamp(12px, 2.2vw, 16px) !important;
      white-space: nowrap;
      letter-spacing: 0.3px;
      line-height: 1.2;
      color: var(--bw-text-primary) !important;
      text-shadow: none !important;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .tagline {
        font-size: clamp(10.5px, 3.1vw, 13px) !important;
        letter-spacing: 0.2px;
      }
      .tagline-wrapper {
        padding: 4px 12px;
      }
    }

    /* Audio Player Container */
    .player-wrapper {
      margin-top: 8px;
    }

    #offlinePlayer {
      background: var(--bw-white) !important;
      border: 1.5px solid var(--bw-border) !important;
      border-radius: 20px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
    }

    .offline-cover {
      background: #111113 !important;
      border: 3px solid #e4e4e7 !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12) !important;
    }

    .cover-icon {
      filter: grayscale(100%) !important;
    }

    .vinyl-center {
      background: #ffffff !important;
      border: 2px solid #27272a !important;
    }

    .cover-glow {
      display: none !important;
    }

    .offline-song-title {
      color: var(--bw-black) !important;
      text-shadow: none !important;
      font-weight: 700 !important;
    }

    .offline-subtitle {
      color: var(--bw-text-secondary) !important;
      font-weight: 500 !important;
    }

    .offline-time {
      color: var(--bw-text-muted) !important;
    }

    .progress-bar-container {
      background: #e4e4e7 !important;
    }

    .progress-fill {
      background: var(--bw-black) !important;
    }

    .offline-control-btn,
    .playlist-toggle-btn {
      color: var(--bw-black) !important;
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
    }

    .offline-control-btn:hover,
    .playlist-toggle-btn:hover {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border-color: var(--bw-black) !important;
    }

    .offline-play-btn {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25) !important;
      border: none !important;
    }

    .offline-play-btn:hover {
      background: #27272a !important;
      transform: scale(1.05);
    }

    .offline-speed-btn {
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
      color: var(--bw-text-primary) !important;
    }

    .offline-speed-btn:hover {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border-color: var(--bw-black) !important;
    }

    .speed-dropdown-menu {
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1) !important;
    }

    .speed-menu-item {
      color: var(--bw-text-primary) !important;
    }

    .speed-menu-item:hover {
      background: var(--bw-surface-subtle) !important;
    }

    .speed-menu-item.active {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      font-weight: 700 !important;
    }

    .offline-volume-btn {
      color: var(--bw-black) !important;
    }

    .offline-volume-btn svg {
      color: var(--bw-black) !important;
      stroke: var(--bw-black) !important;
    }

    .offline-volume-slider {
      background: #e4e4e7 !important;
      accent-color: #000000 !important;
    }

    /* Songs Grid Section */
    .hindi-songs-grid-section {
      width: 100%;
      max-width: 1080px;
      margin: 28px auto 20px;
      padding: 0 16px;
    }

    .grid-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .grid-title {
      font-family: var(--font-festive);
      font-size: clamp(22px, 3.5vw, 28px);
      color: var(--bw-black) !important;
      text-shadow: none !important;
      font-weight: 800;
    }

    .songs-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .song-card {
      position: relative;
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border) !important;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
    }

    .song-card:hover {
      transform: translateY(-3px);
      border-color: var(--bw-border-dark) !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08) !important;
    }

    .song-card.now-playing {
      border: 2px solid var(--bw-black) !important;
      background: var(--bw-surface-subtle) !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12) !important;
    }

    .song-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .song-card-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--bw-black) !important;
      flex-shrink: 0;
    }

    .song-card.now-playing .song-card-number {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border-color: var(--bw-black) !important;
    }

    .song-card-cat {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
      color: var(--bw-text-secondary) !important;
    }

    .song-card-body {
      flex: 1;
    }

    .song-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--bw-black) !important;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .song-card-singer {
      font-size: 13px;
      color: var(--bw-text-secondary) !important;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .song-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--bw-border) !important;
      padding-top: 10px;
      margin-top: 4px;
    }

    .song-card-duration {
      font-size: 12px;
      color: var(--bw-text-muted) !important;
      font-family: var(--font-modern);
    }

    .song-card-play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border: none !important;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .song-card-play-btn:hover {
      background: #27272a !important;
      transform: scale(1.05);
    }

    /* Playlist Drawer Modal */
    .playlist-modal {
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border-dark) !important;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15) !important;
    }

    .playlist-header {
      border-bottom: 1px solid var(--bw-border) !important;
    }

    .playlist-title {
      color: var(--bw-black) !important;
      font-weight: 700 !important;
    }

    .playlist-title-icon svg {
      fill: var(--bw-black) !important;
    }

    .playlist-close {
      color: var(--bw-black) !important;
    }

    .playlist-close:hover {
      background: var(--bw-surface-subtle) !important;
    }

    .playlist-search-wrap {
      background: var(--bw-surface-subtle) !important;
      border: 1px solid var(--bw-border) !important;
    }

    .playlist-search {
      color: var(--bw-black) !important;
    }

    .playlist-search::placeholder {
      color: var(--bw-text-muted) !important;
    }

    .playlist-item {
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border) !important;
      color: var(--bw-black) !important;
    }

    .playlist-item:hover {
      background: var(--bw-surface-subtle) !important;
      border-color: var(--bw-border-dark) !important;
    }

    .playlist-item.active {
      background: var(--bw-surface-subtle) !important;
      border-color: var(--bw-black) !important;
      border-width: 1.5px !important;
    }

    .item-title {
      color: var(--bw-black) !important;
      font-weight: 600 !important;
    }

    .item-singer {
      color: var(--bw-text-secondary) !important;
    }

    .item-duration {
      color: var(--bw-text-muted) !important;
    }

    .item-num {
      color: var(--bw-black) !important;
      font-weight: 700 !important;
    }

    /* Share Dropdown Menu */
    .share-dropdown-menu {
      background: var(--bw-white) !important;
      border: 1px solid var(--bw-border) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12) !important;
    }

    .share-menu-item {
      color: var(--bw-black) !important;
    }

    .share-menu-item:hover {
      background: var(--bw-surface-subtle) !important;
    }

    /* Footer */
    .app-footer {
      border-top: 1px solid var(--bw-border) !important;
      background: var(--bw-white) !important;
      padding: 24px 16px;
    }

    .footer-copyright {
      color: var(--bw-text-muted) !important;
    }

    /* Toast Notification */
    .toast {
      background: var(--bw-black) !important;
      color: var(--bw-white) !important;
      border: 1px solid var(--bw-border-dark) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2) !important;
    }

    @media (max-width: 600px) {
      .songs-cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

              <span class="btn-label" id="whatsappShareText">WhatsApp</span>

            <button class="share-menu-item btn-facebook" id="facebookShareBtn" type="button" role="menuitem"
              title="Facebook पर शेयर करें" aria-label="Share on Facebook">
              <svg class="fb-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">

              <span class="btn-label" id="facebookShareText">Facebook</span>
            </button>

            <button class="share-menu-item btn-instagram" id="instagramShareBtn" type="button" role="menuitem"
              title="Instagram पर शेयर करें" aria-label="Share on Instagram">
              <svg class="insta-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path

              <span class="btn-label" id="instagramShareText">Instagram</span>

          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-container">
    <!-- Hero Logo Header -->
    <main class="logo-container" id="heroSection">
      <div class="divine-sun-halo" aria-hidden="true"></div>
      <h1 class="logo" id="mainLogoText">Hindi Songs</h1>
      <div class="tagline-wrapper">
        <p class="tagline" id="taglineText">॥ बॉलीवुड क्लासिक्स • रोमांटिक हिट्स • डांस बीट्स ॥</p>
      </div>
    </main>

    <!-- Audio Player Container -->
    <section class="player-wrapper" aria-label="हिंदी बॉलीवुड गीत प्लेयर">
      <div id="offlinePlayer">

        <!-- Cover Disc with Equalizer -->
        <div class="offline-cover-wrapper">
          <div class="offline-cover" id="albumCover">
            <span class="cover-icon">🎵</span>
            <div class="vinyl-center"></div>
          </div>
          <div class="cover-glow"></div>
        </div>

        <!-- Song Details & Seekbar -->
        <div class="offline-info">
          <div class="offline-song-title" id="offlineSongName">
            Loading Hindi Songs...
          </div>

          <div class="offline-subtitle" id="offlineSinger">
            Bollywood Hits
          </div>

          <!-- Progress Row -->
          <div class="offline-progress-row">
            <span class="offline-time" id="currentSongTime">0:00</span>
            <div class="progress-bar-container">
              <input type="range" class="offline-progress" id="offlineProgress" min="0" max="100" step="0.1" value="0"
                title="Seek" aria-label="Seek track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="offline-time" id="totalSongTime">0:00</span>
          </div>
        </div>

        <!-- Player Control Buttons -->
        <div class="offline-controls">
          <!-- Previous Song -->
          <button class="offline-control-btn" id="prevSong" title="Previous Track" type="button"
            aria-label="Previous Song">
            ⏮
          </button>

          <!-- Big Main Play/Pause Button -->
          <button class="offline-play-btn" id="offlinePlay" title="चलाएं / रोकें" type="button"
            aria-label="Play or Pause">
            <span id="playIcon">▶</span>
          </button>

          <!-- Next Song -->
          <button class="offline-control-btn" id="nextSong" title="Next Track" type="button" aria-label="Next Song">
            ⏭
          </button>

          <!-- Playlist Toggle Button -->
          <button class="playlist-toggle-btn" id="playlistToggleBtn" title="गीत सूची (Playlist)" type="button"
            aria-label="Open Playlist">
            <span class="icon-list">☰</span>
          </button>

          <!-- Playback Speed Dropdown Control -->
          <div class="speed-dropdown" id="speedDropdown">
            <button class="offline-speed-btn" id="speedBtn" title="प्लेबैक स्पीड बदलें" type="button"
              aria-haspopup="true" aria-expanded="false" aria-label="Playback Speed">
              <span id="speedLabel">1.0x</span>
              <svg class="speed-caret-icon" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="speed-dropdown-menu" id="speedDropdownMenu" role="menu" aria-label="Playback Speed Options">
              <div class="speed-options-list" id="speedOptionsList" role="none">
                <button class="speed-menu-item" type="button" data-speed="0.5" role="menuitem">
                  <span class="speed-val">0.5x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item" type="button" data-speed="0.75" role="menuitem">
                  <span class="speed-val">0.75x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item active" type="button" data-speed="1.0" role="menuitem">
                  <span class="speed-val">1.0x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item" type="button" data-speed="1.25" role="menuitem">
                  <span class="speed-val">1.25x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item" type="button" data-speed="1.5" role="menuitem">
                  <span class="speed-val">1.50x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item" type="button" data-speed="1.75" role="menuitem">
                  <span class="speed-val">1.75x</span>
                  <span class="speed-check">✓</span>
                </button>
                <button class="speed-menu-item" type="button" data-speed="2.0" role="menuitem">
                  <span class="speed-val">2.0x</span>
                  <span class="speed-check">✓</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Volume Controls -->
          <div class="offline-volume">
            <button class="offline-volume-btn" id="muteBtn" title="ध्वनि म्यूट / अनम्यूट" type="button"
              aria-label="Mute Volume">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor">
                <path d="M10 5L5 9H2v6h3l5 4V5z" fill="currentColor" stroke="currentColor" stroke-width="1.2"
                  stroke-linejoin="round" />
                <path d="M13.5 9.5C14.3 10.3 14.8 11.1 14.8 12s-.5 1.7-1.3 2.5" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" />
                <path d="M16.5 7.5C17.9 8.9 18.7 10.4 18.7 12s-.8 3.1-2.2 4.5" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" />
                <path d="M19.5 5.5C21.5 7.5 22.6 9.7 22.6 12s-1.1 4.5-3.1 6.5" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
            <input type="range" class="offline-volume-slider" id="volumeSlider" min="0" max="100" value="100"
              title="Volume" aria-label="Volume">
          </div>
        </div>

        <audio id="offlineAudio" preload="auto"></audio>
      </div>
    </section>

    <!-- Playlist Drawer Modal -->
    <div class="playlist-modal" id="playlistModal" role="dialog" aria-modal="true" aria-labelledby="playlistTitle">
      <div class="playlist-header">
        <div class="playlist-title-wrap">
          <div class="playlist-title" id="playlistTitle">
            <span class="playlist-title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
              </svg>
            </span>
            <span id="playlistTitleText">हिंदी गीत सूची (78)</span>
          </div>
        </div>
        <button class="playlist-close" id="playlistCloseBtn" aria-label="Close Playlist" title="बंद करें">
          ✕
        </button>
      </div>

      <!-- Playlist Search Box -->
      <div class="playlist-search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="playlist-search" id="playlistSearch" placeholder="गीत या गायक का नाम खोजें..."
          aria-label="Search Hindi Songs">
        <button class="search-clear-btn" id="searchClearBtn" aria-label="Clear Search" type="button">✕</button>
      </div>

      <div class="playlist-list" id="playlistList" role="listbox">
        <!-- Dynamic playlist items populated via JS -->
      </div>
    </div>

    <!-- Interactive Hindi Songs Grid Section -->
    <section class="hindi-songs-grid-section" id="songsGridSection">
      <div class="grid-header">
        <h2 class="grid-title" id="gridTitleText">हिंदी सुपरहिट बॉलीवुड संग्रह (78 Songs)</h2>
      </div>

      <div class="songs-cards-grid" id="songsCardsGrid">
        <!-- Cards generated dynamically via hindi-song.js -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer" id="appFooter">
      <div class="footer-content">
        <p class="footer-copyright">© 2026 Superhit Hindi Songs. All Rights Reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Dynamic Toast Notification -->
  <div class="toast" id="toastNotification" role="alert" aria-live="polite"></div>

  <!-- Interactive JavaScript for Hindi Songs -->
  <script src="hindi-song.js"></script>
</body>

</html>
