<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chhath Puja Music</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <meta name="description" content="Chhath Puja geet — bina ads ke, ek jagah.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Khula:wght@400;600;700&family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --maroon-deep: #24080a;
      --maroon: #4a1210;
      --sindoor: #c1392b;
      --marigold: #e8a33d;
      --marigold-bright: #ffb84d;
      --cream: #fdf3e2;
      --cream-dim: #e8d4b8;
      --glow: rgba(255, 184, 77, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Mukta", sans-serif;
      color: var(--cream);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      position: relative;
      background: #160609;
    }

    /* BACKGROUND */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-color: var(--maroon-deep);
      background-image:
        radial-gradient(circle at 50% 20%, rgba(232, 163, 61, 0.18), transparent 55%),
        linear-gradient(180deg, var(--maroon-deep) 0%, #170406 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.6s ease;
    }

    .bg-layer.has-image {
      background-image:
        linear-gradient(180deg, rgba(15, 4, 5, 0.12), rgba(15, 4, 5, 0.28)),
        var(--user-bg);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.12));
    }

    /* TOP BAR */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 50;
      pointer-events: none;
    }

    .time-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 16px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .time-main {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .date-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--marigold-bright);
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .logo-container {
      position: absolute;
      top: 26%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      user-select: none;
      pointer-events: none;
      width: 100%;
    }

    .logo {
      font-size: clamp(65px, 15vw, 190px);
      color: #FFFFFF;
      font-family: "Yatra One", system-ui;
      font-weight: 400;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      margin: 0;
      line-height: 1;
    }

    .tagline {
      font-size: clamp(16px, 3vw, 24px);
      color: var(--marigold-bright);
      margin-top: 10px;
      letter-spacing: 2px;
    }

    /* CUSTOM OFFLINE PLAYER */
    #offlinePlayer {
      position: fixed;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      width: min(800px, 95vw);
      min-height: 100px;
      padding: 14px 24px;
      z-index: 30;
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 18px;
      border-radius: 55px;
      background: linear-gradient(135deg, rgba(42, 18, 27, 0.96), rgba(19, 9, 20, 0.96));
      border: 1px solid rgba(232, 163, 61, 0.30);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* COVER */
    .offline-cover {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: linear-gradient(135deg, #ff8a65, #e53935);
      box-shadow: 0 8px 22px rgba(229, 57, 53, 0.35);
      flex-shrink: 0;
      user-select: none;
    }

    /* SONG INFO */
    .offline-info {
      min-width: 0;
    }

    .offline-song-title {
      font-size: 17px;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .offline-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 6px;
    }

    /* PROGRESS ROW */
    .offline-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .offline-time {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      min-width: 32px;
      user-select: none;
    }

    /* PROGRESS BAR */
    .offline-progress {
      flex: 1;
      height: 6px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      accent-color: #ffb84d;
    }

    .offline-progress::-webkit-slider-runnable-track {
      height: 6px;
      background: linear-gradient(to right, #ffb84d var(--progress, 0%), rgba(255, 255, 255, 0.16) var(--progress, 0%));
      border-radius: 10px;
    }

    .offline-progress::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -4px;
      border: none;
      border-radius: 50%;
      background: #ffb84d;
      box-shadow: 0 0 8px rgba(255, 184, 77, 0.8);
      cursor: pointer;
    }

    .offline-progress::-moz-range-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
    }

    .offline-progress::-moz-range-progress {
      height: 6px;
      background: #ffb84d;
      border-radius: 10px;
    }

    .offline-progress::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #ffb84d;
      cursor: pointer;
    }

    /* CONTROLS */
    .offline-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .offline-control-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .offline-control-btn:hover {
      transform: scale(1.15);
      opacity: 0.8;
    }

    .offline-play-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #24101b;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.20);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .offline-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.30);
    }

    /* VOLUME CONTROL */
    .offline-volume {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .offline-volume-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: white;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .offline-volume-btn:hover {
      opacity: 1;
    }

    .offline-volume-slider {
      width: 55px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      accent-color: #ffb84d;
    }

    .offline-volume-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border: none;
      border-radius: 50%;
      background: #ffb84d;
      cursor: pointer;
    }

    .offline-volume-slider::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: none;
      border-radius: 50%;
      background: #ffb84d;
      cursor: pointer;
    }

    /* PLAYLIST BUTTON */
    .playlist-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(232, 163, 61, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--marigold-bright);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      margin-left: 2px;
    }

    .playlist-toggle-btn:hover,
    .playlist-toggle-btn.active {
      background: var(--marigold-bright);
      color: var(--maroon-deep);
      transform: scale(1.08);
      box-shadow: 0 0 12px var(--glow);
    }

    /* PLAYLIST DRAWER POPUP */
    .playlist-modal {
      position: fixed;
      bottom: 145px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: min(500px, 92vw);
      max-height: 380px;
      background: linear-gradient(135deg, rgba(38, 14, 22, 0.96), rgba(18, 7, 18, 0.98));
      border: 1px solid rgba(232, 163, 61, 0.35);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .playlist-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .playlist-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--marigold-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .playlist-close:hover {
      color: white;
    }

    .playlist-list {
      list-style: none;
      margin: 0;
      padding: 10px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .playlist-list::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-list::-webkit-scrollbar-thumb {
      background: rgba(232, 163, 61, 0.4);
      border-radius: 10px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .playlist-item.active {
      background: rgba(232, 163, 61, 0.2);
      color: var(--marigold-bright);
      font-weight: 600;
      border-left: 3px solid var(--marigold-bright);
    }

    .playlist-item-index {
      font-size: 12px;
      opacity: 0.6;
      width: 20px;
    }

    .playlist-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #offlineAudio {
      display: none;
    }

    /* RESPONSIVENESS */
    @media (max-width: 650px) {
      .time-widget {
        padding: 6px 12px;
      }

      .time-main {
        font-size: 16px;
      }

      .date-sub {
        font-size: 11px;
      }

      .logo-container {
        top: 22%;
      }

      .top-bar {
        height: 65px;
        padding: 15px 16px;
      }

      #offlinePlayer {
        width: 96vw;
        min-height: 85px;
        padding: 10px 14px;
        grid-template-columns: 44px 1fr auto;
        gap: 10px;
        border-radius: 30px;
        bottom: 18px;
      }

      .offline-cover {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .offline-song-title {
        font-size: 14px;
      }

      .offline-subtitle {
        font-size: 11px;
      }

      .offline-controls {
        gap: 6px;
      }

      .offline-control-btn {
        font-size: 15px;
      }

      .offline-play-btn {
        width: 38px;
        height: 38px;
        font-size: 15px;
      }

      .offline-volume-slider {
        width: 32px;
      }

      .playlist-modal {
        bottom: 115px;
        width: 95vw;
        max-height: 320px;
      }
    }

    @media (max-width: 420px) {
      .offline-volume {
        display: none;
      }

      .offline-subtitle {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="top-bar">
    <div class="time-widget">
      <div class="time-main" id="currentTime">--:-- -- IST</div>
      <div class="date-sub" id="currentDate">--</div>
    </div>
  </div>

  <div class="logo-container">
    <div class="logo">छठ घाट</div>
    <div class="tagline">॥ जय छठी मईया ॥</div>
  </div>

  <script>
    /* BACKGROUND */
    const backgrounds = [
      "images/ChatGPT Image Aug 14, 2026, 07_34_48 PM.png",
      "images/ChatGPT Image Aug 14, 2026, 07_36_50 PM.png",
      "images/ChatGPT Image Aug 14, 2026, 07_43_15 PM.png",
      "images/chhath.png"
    ];

    const bgLayer = document.getElementById("bgLayer");

    function tryBackground(index) {
      if (!backgrounds[index]) return;
      const img = new Image();
      img.onload = function () {
        bgLayer.style.setProperty("--user-bg", `url("${backgrounds[index]}")`);
        bgLayer.classList.add("has-image");
      };
      img.onerror = function () {
        console.warn("Background not found:", backgrounds[index]);
        if (index + 1 < backgrounds.length) {
          tryBackground(index + 1);
        }
      };
      img.src = backgrounds[index];
    }

    tryBackground(0);

    /* LIVE CLOCK */
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, "0");
      const suffix = hours >= 12 ? "pm" : "am";
      hours = hours % 12 || 12;

      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      document.getElementById("currentTime").textContent = `${hours}:${minutes} ${suffix} IST`;
      document.getElementById("currentDate").textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* OFFLINE MUSIC PLAYER */
    let songs = [];
    let currentSong = 0;
    let offlineAudio = null;
    const API_URL = "";

    loadOfflineSongs();

    async function loadOfflineSongs() {
      try {
        const response = await fetch(`${API_URL}/songs`);
        if (!response.ok) throw new Error("Songs API failed");

        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          alert("songs folder mein koi MP3 file nahi mili.");
          return;
        }

        songs = data;
        currentSong = 0;
        createOfflinePlayer();
      } catch (error) {
        console.error("Offline songs error:", error);
        alert("Songs load nahi ho rahe.\nCheck karo ki node server.js chal raha hai.");
      }
    }

    function createOfflinePlayer() {
      const oldPlayer = document.getElementById("offlinePlayer");
      if (oldPlayer) oldPlayer.remove();
      const oldModal = document.getElementById("playlistModal");
      if (oldModal) oldModal.remove();

      // 1. Create Player Container
      const player = document.createElement("div");
      player.id = "offlinePlayer";

      player.innerHTML = `
        <div class="offline-cover">🌅</div>

        <div class="offline-info">
          <div class="offline-song-title" id="offlineSongName">${escapeHTML(songs[0].name)}</div>
          <div class="offline-subtitle">छठ महापर्व</div>

          <div class="offline-progress-row">
            <span class="offline-time" id="currentSongTime">0:00</span>
            <input type="range" class="offline-progress" id="offlineProgress" min="0" max="100" step="0.1" value="0" title="Seek">
            <span class="offline-time" id="totalSongTime">0:00</span>
          </div>
        </div>

        <div class="offline-controls">
          <button class="offline-control-btn" id="prevSong" title="Previous" type="button">⏮</button>
          <button class="offline-play-btn" id="offlinePlay" title="Play" type="button">▶</button>
          <button class="offline-control-btn" id="nextSong" title="Next" type="button">⏭</button>

          <div class="offline-volume">
            <button class="offline-volume-btn" id="muteBtn" title="Mute" type="button">🔊</button>
            <input type="range" class="offline-volume-slider" id="volumeSlider" min="0" max="100" value="100" title="Volume">
          </div>

          <button class="playlist-toggle-btn" id="playlistToggleBtn" title="Geet Suchi (Playlist)" type="button">☰</button>
        </div>

        <audio id="offlineAudio" preload="auto"></audio>
      `;

      // 2. Create Playlist Modal
      const playlistModal = document.createElement("div");
      playlistModal.id = "playlistModal";
      playlistModal.className = "playlist-modal";
      playlistModal.innerHTML = `
        <div class="playlist-header">
          <div class="playlist-title">🎵 Chhath Geet List (${songs.length})</div>
          <button class="playlist-close" id="playlistCloseBtn">✕</button>
        </div>
        <ul class="playlist-list" id="playlistList"></ul>
      `;

      document.body.appendChild(player);
      document.body.appendChild(playlistModal);

      offlineAudio = document.getElementById("offlineAudio");
      const songName = document.getElementById("offlineSongName");
      const playButton = document.getElementById("offlinePlay");
      const progress = document.getElementById("offlineProgress");
      const currentTime = document.getElementById("currentSongTime");
      const totalTime = document.getElementById("totalSongTime");
      const muteBtn = document.getElementById("muteBtn");
      const volumeSlider = document.getElementById("volumeSlider");
      const playlistToggleBtn = document.getElementById("playlistToggleBtn");
      const playlistCloseBtn = document.getElementById("playlistCloseBtn");
      const playlistList = document.getElementById("playlistList");

      let lastVolume = 1;
      let isSeeking = false;

      // Render Playlist Items
      function renderPlaylist() {
        playlistList.innerHTML = songs.map((s, idx) => `
          <li class="playlist-item ${idx === currentSong ? 'active' : ''}" data-index="${idx}">
            <span class="playlist-item-index">${idx + 1}.</span>
            <span class="playlist-item-name">${escapeHTML(s.name)}</span>
            ${idx === currentSong ? '<span>🔊</span>' : ''}
          </li>
        `).join('');

        // Attach click listeners to list items
        playlistList.querySelectorAll(".playlist-item").forEach(item => {
          item.addEventListener("click", () => {
            const songIdx = parseInt(item.getAttribute("data-index"), 10);
            playSong(songIdx);
          });
        });
      }

      function formatTime(seconds) {
        if (!isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const secondsPart = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${secondsPart}`;
      }

      function loadSong(index) {
        if (!songs[index]) return;
        currentSong = index;
        offlineAudio.src = songs[index].file;
        songName.textContent = songs[index].name;
        currentTime.textContent = "0:00";
        totalTime.textContent = "0:00";
        progress.value = 0;
        progress.style.setProperty("--progress", "0%");
        offlineAudio.load();
        renderPlaylist();
      }

      function playSong(index) {
        loadSong(index);
        offlineAudio.play().catch(err => {
          console.warn("Autoplay deferred:", err);
          playButton.textContent = "▶";
        });
      }

      /* TOGGLE PLAYLIST MODAL */
      playlistToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        playlistModal.classList.toggle("open");
        playlistToggleBtn.classList.toggle("active");
      });

      playlistCloseBtn.addEventListener("click", () => {
        playlistModal.classList.remove("open");
        playlistToggleBtn.classList.remove("active");
      });

      // Close modal when clicking outside
      document.addEventListener("click", (e) => {
        if (!playlistModal.contains(e.target) && e.target !== playlistToggleBtn) {
          playlistModal.classList.remove("open");
          playlistToggleBtn.classList.remove("active");
        }
      });

      /* PLAY / PAUSE */
      playButton.addEventListener("click", function () {
        if (offlineAudio.paused) {
          offlineAudio.play().catch(e => console.error("Play error:", e));
        } else {
          offlineAudio.pause();
        }
      });

      /* PREVIOUS / NEXT */
      document.getElementById("prevSong").addEventListener("click", function () {
        currentSong = (currentSong - 1 + songs.length) % songs.length;
        playSong(currentSong);
      });

      document.getElementById("nextSong").addEventListener("click", function () {
        currentSong = (currentSong + 1) % songs.length;
        playSong(currentSong);
      });

      /* METADATA & TIMEUPDATE */
      offlineAudio.addEventListener("loadedmetadata", function () {
        totalTime.textContent = formatTime(offlineAudio.duration);
      });

      offlineAudio.addEventListener("timeupdate", function () {
        if (isSeeking) return;

        if (offlineAudio.duration && isFinite(offlineAudio.duration)) {
          const percent = (offlineAudio.currentTime / offlineAudio.duration) * 100;
          progress.value = percent;
          progress.style.setProperty("--progress", `${percent}%`);
        }
        currentTime.textContent = formatTime(offlineAudio.currentTime);
      });

      /* INSTANT SEEKING */
      progress.addEventListener("input", function () {
        if (!offlineAudio.duration || !isFinite(offlineAudio.duration)) return;
        isSeeking = true;
        const seekPercent = progress.value;
        const previewTime = (seekPercent / 100) * offlineAudio.duration;
        progress.style.setProperty("--progress", `${seekPercent}%`);
        currentTime.textContent = formatTime(previewTime);
      });

      progress.addEventListener("change", function () {
        if (!offlineAudio.duration || !isFinite(offlineAudio.duration)) return;
        const targetTime = (progress.value / 100) * offlineAudio.duration;
        offlineAudio.currentTime = targetTime;
        isSeeking = false;
      });

      /* EVENTS */
      offlineAudio.addEventListener("play", () => playButton.textContent = "❚❚");
      offlineAudio.addEventListener("pause", () => playButton.textContent = "▶");
      offlineAudio.addEventListener("ended", () => {
        currentSong = (currentSong + 1) % songs.length;
        playSong(currentSong);
      });

      /* VOLUME */
      volumeSlider.addEventListener("input", function () {
        const vol = volumeSlider.value / 100;
        offlineAudio.volume = vol;
        muteBtn.textContent = vol === 0 ? "🔇" : vol < 0.5 ? "🔉" : "🔊";
      });

      muteBtn.addEventListener("click", function () {
        if (offlineAudio.volume > 0) {
          lastVolume = offlineAudio.volume;
          offlineAudio.volume = 0;
          volumeSlider.value = 0;
          muteBtn.textContent = "🔇";
        } else {
          offlineAudio.volume = lastVolume;
          volumeSlider.value = lastVolume * 100;
          muteBtn.textContent = lastVolume < 0.5 ? "🔉" : "🔊";
        }
      });

      // Initial song load
      loadSong(0);
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>

</html>
