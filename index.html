<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chhath Puja Geet</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <meta name="description"
    content="Listen to Chhath Puja songs, Bhojpuri Chhath Geet, Chhathi Maiya Bhajan and Surya Dev devotional songs online. Enjoy popular traditional Chhath songs in one place.">

    <meta property="og:type" content="website">
  <meta property="og:title" content="Chhath Puja Geet">
  <meta property="og:description"
    content="Listen to Chhath Puja songs, Bhojpuri Chhath Geet, Chhathi Maiya Bhajan and Surya Dev devotional songs online.">
  <meta property="og:url" content="https://chhath-puja.onrender.com/">
  <meta property="og:image" content="https://chhath-puja.onrender.com/images/image_background.png">
  <meta property="og:site_name" content="Chhath Ghat">

  <link rel="preload" as="image" href="images/chhath_puja_400x838.png" media="(max-width: 1180px)">
  <link rel="preload" as="image" href="images/image_background.png" media="(min-width: 1181px)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Khula:wght@400;600;700&family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --maroon-deep: #24080a;
      --maroon: #4a1210;
      --sindoor: #c1392b;
      --marigold: #e8a33d;
      --marigold-bright: #ffb84d;
      --cream: #fdf3e2;
      --cream-dim: #e8d4b8;
      --glow: rgba(255, 184, 77, 0.35);
      --safe-bottom: env(safe-area-inset-bottom, 12px);
      --safe-top: env(safe-area-inset-top, 12px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Mukta", sans-serif;
      color: var(--cream);
      overflow-x: hidden;
      background-color: var(--maroon-deep);
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 0;
      background-color: var(--maroon-deep);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.02);
      background-image: url("images/image_background.png");
    }

    @media (max-width: 1180px) {
      .bg-layer {
        background-image: url("images/chhath_puja_400x838.png");
      }
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(15, 4, 5, 0.35) 0%,
        rgba(15, 4, 5, 0.70) 100%
      );
    }

    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(14px + var(--safe-top))
        16px
        calc(14px + var(--safe-bottom));
      gap: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }

    .time-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .time-main {
      font-size: clamp(13px, 3.5vw, 17px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .date-sub {
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 500;
      color: var(--marigold-bright);
      line-height: 1.2;
    }

    .logo-container {
      text-align: center;
      user-select: none;
      pointer-events: none;
      margin: auto 0;
      margin-top: -5vh;
      padding: 10px 0;
      width: 100%;
    }

    .logo {
      font-size: clamp(56px, 14vw, 150px);
      color: #FFFFFF;
      font-family: "Yatra One", system-ui;
      font-weight: 400;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.75);
      margin: 0;
      line-height: 1.05;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: clamp(18px, 4vw, 30px);
      color: var(--marigold-bright);
      margin-top: 6px;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 400px) {
      .logo-container {
        margin-top: 15vh;
        padding: 6px 0;
      }

      .logo {
        font-size: clamp(46px, 15vw, 62px);
        letter-spacing: 1px;
      }

      .tagline {
        font-size: 18px;
        margin-top: 4px;
        letter-spacing: 1.5px;
      }

      #offlinePlayer {
        padding: 8px 10px;
        border-radius: 18px;
        gap: 6px 8px;
      }

      .offline-cover {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }

      .offline-song-title {
        font-size: 13px;
      }

      .offline-controls {
        gap: 4px;
        padding-top: 4px;
      }

      .offline-control-btn {
        width: 26px;
        height: 26px;
        font-size: 14px;
      }

      .offline-play-btn {
        width: 34px;
        height: 34px;
        font-size: 14px;
      }

      .playlist-toggle-btn {
        width: 26px;
        height: 26px;
        font-size: 12px;
      }

      .offline-volume-slider {
        width: 30px;
      }
    }

    #offlinePlayer {
      width: min(850px, 100%);
      padding: 12px 18px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      border-radius: 40px;
      background: linear-gradient(
        135deg,
        rgba(38, 14, 22, 0.94),
        rgba(18, 7, 18, 0.96)
      );
      border: 1px solid rgba(232, 163, 61, 0.35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s ease;
    }

    .offline-cover {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(135deg, #ff8a65, #e53935);
      box-shadow: 0 6px 16px rgba(229, 57, 53, 0.35);
      flex-shrink: 0;
    }

    .offline-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .offline-song-title {
      font-size: clamp(13px, 2.8vw, 15px);
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .offline-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 4px;
    }

    .offline-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .offline-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      min-width: 28px;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .offline-progress {
      flex: 1;
      height: 5px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      accent-color: #ffb84d;
    }

    .offline-progress::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffb84d;
      box-shadow: 0 0 6px rgba(255, 184, 77, 0.8);
      cursor: pointer;
    }

    .offline-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .offline-control-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .offline-control-btn:active {
      transform: scale(0.88);
    }

    .offline-play-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #24101b;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    .offline-play-btn:active {
      transform: scale(0.92);
    }

    .offline-volume {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .offline-volume-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .offline-volume-slider {
      width: 50px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      accent-color: #ffb84d;
    }

    .playlist-toggle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(232, 163, 61, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--marigold-bright);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .playlist-modal {
      position: fixed;
      bottom: calc(110px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: min(520px, 94vw);
      max-height: min(380px, 45dvh);
      background: linear-gradient(
        135deg,
        rgba(38, 14, 22, 0.98),
        rgba(18, 7, 18, 0.98)
      );
      border: 1px solid rgba(232, 163, 61, 0.35);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .playlist-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .playlist-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--marigold-bright);
    }

    .playlist-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .playlist-list {
      list-style: none;
      margin: 0;
      padding: 8px 10px;
      overflow-y: auto;
      flex: 1;
      overscroll-behavior: contain;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.85);
    }

    .playlist-item.active {
      background: rgba(232, 163, 61, 0.2);
      color: var(--marigold-bright);
      font-weight: 600;
      border-left: 3px solid var(--marigold-bright);
    }

    .playlist-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 640px) {
      #offlinePlayer {
        grid-template-columns: 44px 1fr;
        grid-template-rows: auto auto;
        padding: 10px 14px;
        border-radius: 22px;
        gap: 8px 10px;
      }

      .offline-cover {
        width: 44px;
        height: 44px;
        font-size: 20px;
        grid-column: 1 / 2;
        grid-row: 1 / 2;
      }

      .offline-info {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
      }

      .offline-controls {
        grid-column: 1 / 3;
        grid-row: 2 / 3;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .offline-control-btn {
        width: 28px;
        height: 28px;
        font-size: 15px;
      }

      .offline-play-btn {
        width: 36px;
        height: 36px;
        font-size: 15px;
        margin: 0 2px;
      }

      .playlist-toggle-btn {
        width: 28px;
        height: 28px;
        font-size: 13px;
      }

      .offline-volume {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 2px;
      }

      .offline-volume-btn {
        width: 24px;
        height: 24px;
        font-size: 13px;
      }

      .offline-volume-slider {
        width: 38px;
        height: 3px;
      }

      .playlist-modal {
        bottom: calc(130px + var(--safe-bottom));
        width: 94vw;
        border-radius: 16px;
      }
    }

    .offline-volume-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: block;
      pointer-events: none;
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      flex-shrink: 0;
    }

    .equalizer-bar {
      width: 3px;
      background-color: var(--marigold-bright);
      border-radius: 2px;
      animation: bounce 1s ease-in-out infinite alternate;
    }

    .equalizer-bar:nth-child(1) {
      height: 40%;
      animation-delay: 0.1s;
    }

    .equalizer-bar:nth-child(2) {
      height: 100%;
      animation-delay: 0.3s;
    }

    .equalizer-bar:nth-child(3) {
      height: 60%;
      animation-delay: 0.2s;
    }

    @keyframes bounce {
      0% {
        height: 20%;
      }

      100% {
        height: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">

    <header class="top-bar">
      <div class="time-widget">
        <div class="time-main" id="currentTime">--:-- -- IST</div>
        <div class="date-sub" id="currentDate">--</div>
      </div>
    </header>

    <main class="logo-container">
      <h1 class="logo">छठ घाट</h1>
      <div class="tagline">॥ जय छठी मईया ॥</div>
    </main>

    <div id="offlinePlayer">

      <div class="offline-cover">🌅</div>

      <div class="offline-info">
        <div class="offline-song-title" id="offlineSongName">
          Loading Geet...
        </div>

        <div class="offline-subtitle">
          छठ महापर्व
        </div>

        <div class="offline-progress-row">
          <span class="offline-time" id="currentSongTime">
            0:00
          </span>

          <input
            type="range"
            class="offline-progress"
            id="offlineProgress"
            min="0"
            max="100"
            step="0.1"
            value="0"
            title="Seek"
          >

          <span class="offline-time" id="totalSongTime">
            0:00
          </span>
        </div>
      </div>

      <div class="offline-controls">

        <button
          class="playlist-toggle-btn"
          id="playlistToggleBtn"
          title="Playlist"
          type="button"
          aria-label="Open Playlist">
          ☰
        </button>

        <button
          class="offline-control-btn"
          id="prevSong"
          title="Previous"
          type="button"
          aria-label="Previous Song">
          ⏮
        </button>

        <button
          class="offline-play-btn"
          id="offlinePlay"
          title="Play"
          type="button"
          aria-label="Play or Pause">
          ▶
        </button>

        <button
          class="offline-control-btn"
          id="nextSong"
          title="Next"
          type="button"
          aria-label="Next Song">
          ⏭
        </button>

        <div class="offline-volume">

          <button
            class="offline-volume-btn"
            id="muteBtn"
            title="Mute"
            type="button"
            aria-label="Mute Volume">

            <svg viewBox="0 0 24 24">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
            </svg>

          </button>

          <input
            type="range"
            class="offline-volume-slider"
            id="volumeSlider"
            min="0"
            max="100"
            value="100"
            title="Volume"
          >

        </div>
      </div>

      <audio
        id="offlineAudio"
        preload="metadata">
      </audio>

    </div>

    <div
      class="playlist-modal"
      id="playlistModal">

      <div class="playlist-header">

        <div
          class="playlist-title"
          id="playlistTitle">
          🎵 Chhath Geet List
        </div>

        <button
          class="playlist-close"
          id="playlistCloseBtn"
          aria-label="Close Playlist">
          ✕
        </button>

      </div>

      <ul
        class="playlist-list"
        id="playlistList">
      </ul>

    </div>

  </div>


<script>

/* =========================================================
   LIVE CLOCK
   ========================================================= */

function updateClock() {

  const now = new Date();

  let hours = now.getHours();

  const minutes =
    now.getMinutes()
      .toString()
      .padStart(2, "0");

  const suffix =
    hours >= 12 ? "pm" : "am";

  hours =
    hours % 12 || 12;

  const days = [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ];

  const months = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  document.getElementById("currentTime").textContent =
    `${hours}:${minutes} ${suffix} IST`;

  document.getElementById("currentDate").textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================================================
   AUDIO PLAYER
   ========================================================= */

let songs = [];

let currentSong = 0;

let isSeeking = false;

let lastVolume = 1;


const offlineAudio =
  document.getElementById("offlineAudio");

const songName =
  document.getElementById("offlineSongName");

const playButton =
  document.getElementById("offlinePlay");

const progress =
  document.getElementById("offlineProgress");

const currentTime =
  document.getElementById("currentSongTime");

const totalTime =
  document.getElementById("totalSongTime");

const muteBtn =
  document.getElementById("muteBtn");

const volumeSlider =
  document.getElementById("volumeSlider");

const playlistToggleBtn =
  document.getElementById("playlistToggleBtn");

const playlistCloseBtn =
  document.getElementById("playlistCloseBtn");

const playlistModal =
  document.getElementById("playlistModal");

const playlistList =
  document.getElementById("playlistList");

const playlistTitle =
  document.getElementById("playlistTitle");


/* =========================================================
   LOAD SONGS
   ========================================================= */

async function loadOfflineSongs() {

  try {

    const response =
      await fetch(
        "songs.json",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "songs.json load nahi hui"
      );
    }

    songs =
      await response.json();

    if (
      !Array.isArray(songs) ||
      songs.length === 0
    ) {

      songName.textContent =
        "No Song Found";

      return;
    }

    playlistTitle.textContent =
      `🎵 Chhath Geet List (${songs.length})`;

    renderPlaylist();

    loadSong(0);

  } catch (error) {

    console.error(
      "Songs fetch failed:",
      error
    );

    songName.textContent =
      "The songs could not be loaded.";

  }

}


/* =========================================================
   PLAYLIST
   ========================================================= */

function renderPlaylist() {

  const isPlaying =
    !offlineAudio.paused;

  playlistList.innerHTML =
    songs.map(
      (s, idx) => `

      <li
        class="playlist-item ${
          idx === currentSong
            ? "active"
            : ""
        }"
        data-index="${idx}"
      >

        <span>
          ${idx + 1}.
        </span>

        <span class="playlist-item-name">
          ${escapeHTML(s.name)}
        </span>

        ${
          idx === currentSong &&
          isPlaying
            ? `
              <span class="equalizer">

                <span class="equalizer-bar"></span>

                <span class="equalizer-bar"></span>

                <span class="equalizer-bar"></span>

              </span>
            `
            : ""
        }

      </li>

    `
    ).join("");


  playlistList
    .querySelectorAll(
      ".playlist-item"
    )
    .forEach(
      item => {

        item.addEventListener(
          "click",
          e => {

            e.stopPropagation();

            const songIdx =
              parseInt(
                item.getAttribute(
                  "data-index"
                ),
                10
              );

            playSong(songIdx);

            playlistModal
              .classList
              .remove("open");

          }
        );

      }
    );

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(seconds) {

  if (
    !isFinite(seconds) ||
    isNaN(seconds)
  ) {
    return "0:00";
  }

  const m =
    Math.floor(
      seconds / 60
    );

  const s =
    Math.floor(
      seconds % 60
    )
      .toString()
      .padStart(2, "0");

  return `${m}:${s}`;

}


/* =========================================================
   MEDIA SESSION
   IMPORTANT:
   NO "STOP" HANDLER
   ========================================================= */

const MEDIA_SESSION_SUPPORTED =
  "mediaSession" in navigator;


function updateMediaSessionPosition() {

  if (
    !MEDIA_SESSION_SUPPORTED ||
    !(
      "setPositionState"
      in navigator.mediaSession
    )
  ) {
    return;
  }

  const duration =
    offlineAudio.duration;

  const position =
    offlineAudio.currentTime;

  const playbackRate =
    offlineAudio.playbackRate || 1;


  if (
    !isFinite(duration) ||
    duration <= 0 ||
    !isFinite(position) ||
    position < 0 ||
    !isFinite(playbackRate) ||
    playbackRate <= 0
  ) {
    return;
  }


  try {

    navigator.mediaSession.setPositionState({

      duration:
        duration,

      playbackRate:
        playbackRate,

      position:
        Math.min(
          position,
          duration
        )

    });

  } catch (error) {

    console.debug(
      "Media Session position error:",
      error
    );

  }

}


/* =========================================================
   MEDIA SESSION METADATA
   ========================================================= */

function updateMediaSessionMetadata() {

  if (
    !MEDIA_SESSION_SUPPORTED ||
    !songs[currentSong]
  ) {
    return;
  }


  try {

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          songs[currentSong].name,

        artist:
          "छठ महापर्व",

        album:
          "छठ घाट",

        artwork: [

          {
            src:
              "/images/logo.png",

            sizes:
              "96x96",

            type:
              "image/png"
          },

          {
            src:
              "/images/logo.png",

            sizes:
              "128x128",

            type:
              "image/png"
          },

          {
            src:
              "/images/logo.png",

            sizes:
              "192x192",

            type:
              "image/png"
          },

          {
            src:
              "/images/logo.png",

            sizes:
              "256x256",

            type:
              "image/png"
          },

          {
            src:
              "/images/logo.png",

            sizes:
              "512x512",

            type:
              "image/png"
          }

        ]

      });

  } catch (error) {

    console.error(
      "Media Session metadata error:",
      error
    );

  }

}


/* =========================================================
   MEDIA SESSION ACTION HANDLERS
   ========================================================= */

function setupMediaSessionHandlers() {

  if (!MEDIA_SESSION_SUPPORTED) {

    console.log(
      "Media Session API is not supported."
    );

    return;
  }


  /* PLAY */

  try {

    navigator.mediaSession.setActionHandler(
      "play",
      async () => {

        try {

          await offlineAudio.play();

          navigator.mediaSession.playbackState =
            "playing";

        } catch (error) {

          console.error(
            "Media Session play error:",
            error
          );

        }

      }
    );

  } catch (error) {

    console.debug(
      "Play action not supported:",
      error
    );

  }


  /* PAUSE */

  try {

    navigator.mediaSession.setActionHandler(
      "pause",
      () => {

        offlineAudio.pause();

        navigator.mediaSession.playbackState =
          "paused";

      }
    );

  } catch (error) {

    console.debug(
      "Pause action not supported:",
      error
    );

  }


  /* PREVIOUS TRACK */

  try {

    navigator.mediaSession.setActionHandler(
      "previoustrack",
      () => {

        if (!songs.length) {
          return;
        }

        currentSong =
          (
            currentSong -
            1 +
            songs.length
          ) %
          songs.length;

        playSong(
          currentSong
        );

      }
    );

  } catch (error) {

    console.debug(
      "Previous track not supported:",
      error
    );

  }


  /* NEXT TRACK */

  try {

    navigator.mediaSession.setActionHandler(
      "nexttrack",
      () => {

        if (!songs.length) {
          return;
        }

        currentSong =
          (
            currentSong +
            1
          ) %
          songs.length;

        playSong(
          currentSong
        );

      }
    );

  } catch (error) {

    console.debug(
      "Next track not supported:",
      error
    );

  }


  /* SEEK BACKWARD */

  try {

    navigator.mediaSession.setActionHandler(
      "seekbackward",
      details => {

        if (
          !isFinite(
            offlineAudio.duration
          )
        ) {
          return;
        }

        const skip =
          details.seekOffset || 10;

        offlineAudio.currentTime =
          Math.max(
            offlineAudio.currentTime -
              skip,
            0
          );

        updateMediaSessionPosition();

      }
    );

  } catch (error) {

    console.debug(
      "Seek backward not supported:",
      error
    );

  }


  /* SEEK FORWARD */

  try {

    navigator.mediaSession.setActionHandler(
      "seekforward",
      details => {

        if (
          !isFinite(
            offlineAudio.duration
          )
        ) {
          return;
        }

        const skip =
          details.seekOffset || 10;

        offlineAudio.currentTime =
          Math.min(
            offlineAudio.currentTime +
              skip,
            offlineAudio.duration
          );

        updateMediaSessionPosition();

      }
    );

  } catch (error) {

    console.debug(
      "Seek forward not supported:",
      error
    );

  }


  /* SEEK TO */

  try {

    navigator.mediaSession.setActionHandler(
      "seekto",
      details => {

        if (
          !isFinite(
            offlineAudio.duration
          ) ||
          !isFinite(
            details.seekTime
          )
        ) {
          return;
        }

        offlineAudio.currentTime =
          Math.max(
            0,
            Math.min(
              details.seekTime,
              offlineAudio.duration
            )
          );

        updateMediaSessionPosition();

      }
    );

  } catch (error) {

    console.debug(
      "Seek to not supported:",
      error
    );

  }


  /*
   ========================================================
   IMPORTANT CHANGE

   "stop" ACTION HANDLER INTENTIONALLY REMOVED.

   Pehle yahan:

   navigator.mediaSession.setActionHandler("stop", ...)

   tha jo pause + currentTime=0 +
   playbackState="none" karta tha.

   Ab browser/Android ke stop/dismiss behavior
   ko JavaScript se manually force nahi kiya ja raha.
   ========================================================
  */

}


/* =========================================================
   SETUP MEDIA SESSION
   ========================================================= */

setupMediaSessionHandlers();


/* =========================================================
   LOAD SONG
   ========================================================= */

function loadSong(index) {

  if (!songs[index]) {
    return;
  }

  currentSong =
    index;

  offlineAudio.pause();

  offlineAudio.src =
    songs[index].file;

  offlineAudio.load();

  songName.textContent =
    songs[index].name;

  currentTime.textContent =
    "0:00";

  totalTime.textContent =
    "0:00";

  progress.value =
    0;

  renderPlaylist();

  updateMediaSessionMetadata();

}


/* =========================================================
   PLAY SONG
   ========================================================= */

async function playSong(index) {

  if (!songs[index]) {
    return;
  }

  loadSong(index);

  try {

    await offlineAudio.play();

  } catch (error) {

    console.warn(
      "Play blocked:",
      error
    );

    playButton.textContent =
      "▶";

  }

}


/* =========================================================
   MAIN PLAY / PAUSE
   ========================================================= */

playButton.addEventListener(
  "click",
  async () => {

    if (offlineAudio.paused) {

      try {

        await offlineAudio.play();

      } catch (error) {

        console.error(
          "Play error:",
          error
        );

      }

    } else {

      offlineAudio.pause();

    }

  }
);


/* =========================================================
   PREVIOUS
   ========================================================= */

document
  .getElementById("prevSong")
  .addEventListener(
    "click",
    () => {

      if (!songs.length) {
        return;
      }

      currentSong =
        (
          currentSong -
          1 +
          songs.length
        ) %
        songs.length;

      playSong(
        currentSong
      );

    }
  );


/* =========================================================
   NEXT
   ========================================================= */

document
  .getElementById("nextSong")
  .addEventListener(
    "click",
    () => {

      if (!songs.length) {
        return;
      }

      currentSong =
        (
          currentSong +
          1
        ) %
        songs.length;

      playSong(
        currentSong
      );

    }
  );


/* =========================================================
   AUDIO LOADED
   ========================================================= */

offlineAudio.addEventListener(
  "loadedmetadata",
  () => {

    totalTime.textContent =
      formatTime(
        offlineAudio.duration
      );

    updateMediaSessionPosition();

  }
);


/* =========================================================
   AUDIO TIME UPDATE
   ========================================================= */

offlineAudio.addEventListener(
  "timeupdate",
  () => {

    if (isSeeking) {
      return;
    }

    if (
      offlineAudio.duration &&
      isFinite(
        offlineAudio.duration
      )
    ) {

      progress.value =
        (
          offlineAudio.currentTime /
          offlineAudio.duration
        ) *
        100;

      updateMediaSessionPosition();

    }

    currentTime.textContent =
      formatTime(
        offlineAudio.currentTime
      );

  }
);


/* =========================================================
   SEEK START
   ========================================================= */

progress.addEventListener(
  "mousedown",
  () => {
    isSeeking = true;
  }
);

progress.addEventListener(
  "touchstart",
  () => {
    isSeeking = true;
  }
);


/* =========================================================
   SEEK INPUT
   ========================================================= */

progress.addEventListener(
  "input",
  () => {

    if (!offlineAudio.duration) {
      return;
    }

    isSeeking = true;

    currentTime.textContent =
      formatTime(
        (
          progress.value /
          100
        ) *
        offlineAudio.duration
      );

  }
);


/* =========================================================
   SEEK CHANGE
   ========================================================= */

progress.addEventListener(
  "change",
  () => {

    if (!offlineAudio.duration) {
      return;
    }

    offlineAudio.currentTime =
      (
        progress.value /
        100
      ) *
      offlineAudio.duration;

    isSeeking = false;

    updateMediaSessionPosition();

  }
);


/* =========================================================
   AUDIO PLAY EVENT
   ========================================================= */

offlineAudio.addEventListener(
  "play",
  () => {

    playButton.textContent =
      "❚❚";

    if (MEDIA_SESSION_SUPPORTED) {

      updateMediaSessionMetadata();

      navigator.mediaSession.playbackState =
        "playing";

    }

    renderPlaylist();

    updateMediaSessionPosition();

  }
);


/* =========================================================
   AUDIO PLAYING EVENT
   ========================================================= */

offlineAudio.addEventListener(
  "playing",
  () => {

    if (MEDIA_SESSION_SUPPORTED) {

      updateMediaSessionMetadata();

      navigator.mediaSession.playbackState =
        "playing";

    }

    updateMediaSessionPosition();

  }
);


/* =========================================================
   AUDIO PAUSE EVENT
   ========================================================= */

offlineAudio.addEventListener(
  "pause",
  () => {

    playButton.textContent =
      "▶";

    if (MEDIA_SESSION_SUPPORTED) {

      navigator.mediaSession.playbackState =
        "paused";

    }

    renderPlaylist();

    updateMediaSessionPosition();

  }
);


/* =========================================================
   AUDIO ENDED
   ========================================================= */

offlineAudio.addEventListener(
  "ended",
  () => {

    if (!songs.length) {
      return;
    }

    currentSong =
      (
        currentSong +
        1
      ) %
      songs.length;

    playSong(
      currentSong
    );

  }
);


/* =========================================================
   VOLUME
   ========================================================= */

volumeSlider.addEventListener(
  "input",
  () => {

    const vol =
      volumeSlider.value /
      100;

    offlineAudio.volume =
      vol;

    updateVolumeIcon(
      vol
    );

  }
);


/* =========================================================
   VOLUME ICONS
   ========================================================= */

const VOL_HIGH_ICON = `
  <svg viewBox="0 0 24 24">
    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
  </svg>
`;

const VOL_LOW_ICON = `
  <svg viewBox="0 0 24 24">
    <path d="M7 9v6h4l5 5V4L11 9H7zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25-2.5-4.02z"/>
  </svg>
`;

const VOL_MUTE_ICON = `
  <svg viewBox="0 0 24 24">
    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
  </svg>
`;


function updateVolumeIcon(vol) {

  if (vol === 0) {

    muteBtn.innerHTML =
      VOL_MUTE_ICON;

  } else if (vol < 0.5) {

    muteBtn.innerHTML =
      VOL_LOW_ICON;

  } else {

    muteBtn.innerHTML =
      VOL_HIGH_ICON;

  }

}


/* =========================================================
   MUTE
   ========================================================= */

muteBtn.addEventListener(
  "click",
  () => {

    if (offlineAudio.volume > 0) {

      lastVolume =
        offlineAudio.volume;

      offlineAudio.volume =
        0;

      volumeSlider.value =
        0;

      updateVolumeIcon(0);

    } else {

      offlineAudio.volume =
        lastVolume;

      volumeSlider.value =
        lastVolume * 100;

      updateVolumeIcon(
        lastVolume
      );

    }

  }
);


/* =========================================================
   PLAYLIST OPEN
   ========================================================= */

playlistToggleBtn.addEventListener(
  "click",
  e => {

    e.stopPropagation();

    playlistModal.classList.toggle(
      "open"
    );

  }
);


/* =========================================================
   PLAYLIST CLOSE
   ========================================================= */

playlistCloseBtn.addEventListener(
  "click",
  e => {

    e.stopPropagation();

    playlistModal.classList.remove(
      "open"
    );

  }
);


playlistModal.addEventListener(
  "click",
  e => {

    e.stopPropagation();

  }
);


document.addEventListener(
  "click",
  e => {

    if (
      !playlistModal.contains(
        e.target
      ) &&
      e.target !==
        playlistToggleBtn
    ) {

      playlistModal.classList.remove(
        "open"
      );

    }

  }
);


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================================
   INITIAL VOLUME
   ========================================================= */

offlineAudio.volume =
  1;

volumeSlider.value =
  100;

updateVolumeIcon(1);


/* =========================================================
   START
   ========================================================= */

loadOfflineSongs();

</script>
