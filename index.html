<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chhath Puja Music</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <meta name="description" content="Chhath Puja geet — bina ads ke, ek jagah.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Khula:wght@400;600;700&family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --maroon-deep: #24080a;
      --maroon: #4a1210;
      --sindoor: #c1392b;
      --marigold: #e8a33d;
      --marigold-bright: #ffb84d;
      --cream: #fdf3e2;
      --cream-dim: #e8d4b8;
      --glow: rgba(255, 184, 77, 0.35);
      --safe-bottom: env(safe-area-inset-bottom, 12px);
      --safe-top: env(safe-area-inset-top, 12px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Mukta", sans-serif;
      color: var(--cream);
      overflow-x: hidden;
      background-color: var(--maroon-deep);
    }

    /* ========================================================
       RESPONSIVE BACKGROUND LAYER
       ======================================================== */
    .bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 0;
      background-color: var(--maroon-deep);
      background-image:
        radial-gradient(circle at 50% 20%, rgba(232, 163, 61, 0.22), transparent 60%),
        linear-gradient(180deg, var(--maroon-deep) 0%, #170406 100%);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: background-image 0.4s ease-in-out;
      transform: scale(1.02);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(15, 4, 5, 0.35) 0%, rgba(15, 4, 5, 0.70) 100%);
    }

    /* MAIN APP WRAPPER */
    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
      gap: 16px;
    }

    /* TOP BAR / CLOCK */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }

    .time-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .time-main {
      font-size: clamp(13px, 3.5vw, 17px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .date-sub {
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 500;
      color: var(--marigold-bright);
      line-height: 1.2;
    }

    /* LOGO SECTION */
    .logo-container {
      text-align: center;
      user-select: none;
      pointer-events: none;
      margin: auto 0;
      padding: 10px 0;
      width: 100%;
    }

    .logo {
      font-size: clamp(40px, 11vw, 110px);
      color: #FFFFFF;
      font-family: "Yatra One", system-ui;
      font-weight: 400;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.75);
      margin: 0;
      line-height: 1.05;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: clamp(13px, 3vw, 20px);
      color: var(--marigold-bright);
      margin-top: 6px;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* ========================================================
       RESPONSIVE AUDIO PLAYER (Desktop: 1 Row, Mobile: 2 Rows)
       ======================================================== */
    #offlinePlayer {
      width: min(850px, 100%);
      padding: 12px 18px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      border-radius: 40px;
      background: linear-gradient(135deg, rgba(38, 14, 22, 0.94), rgba(18, 7, 18, 0.96));
      border: 1px solid rgba(232, 163, 61, 0.35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s ease;
    }

    .offline-cover {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(135deg, #ff8a65, #e53935);
      box-shadow: 0 6px 16px rgba(229, 57, 53, 0.35);
      flex-shrink: 0;
    }

    .offline-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .offline-song-title {
      font-size: clamp(13px, 2.8vw, 15px);
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .offline-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 4px;
    }

    .offline-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .offline-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      min-width: 28px;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .offline-progress {
      flex: 1;
      height: 5px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      accent-color: #ffb84d;
    }

    .offline-progress::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffb84d;
      box-shadow: 0 0 6px rgba(255, 184, 77, 0.8);
      cursor: pointer;
    }

    /* CONTROLS */
    .offline-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .offline-control-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .offline-control-btn:active {
      transform: scale(0.88);
    }

    .offline-play-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #24101b;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    .offline-play-btn:active {
      transform: scale(0.92);
    }

    .offline-volume {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .offline-volume-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .offline-volume-slider {
      width: 50px;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      accent-color: #ffb84d;
    }

    .playlist-toggle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(232, 163, 61, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--marigold-bright);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* PLAYLIST MODAL */
    .playlist-modal {
      position: fixed;
      bottom: calc(110px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: min(520px, 94vw);
      max-height: min(380px, 45dvh);
      background: linear-gradient(135deg, rgba(38, 14, 22, 0.98), rgba(18, 7, 18, 0.98));
      border: 1px solid rgba(232, 163, 61, 0.35);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .playlist-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .playlist-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--marigold-bright);
    }

    .playlist-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .playlist-list {
      list-style: none;
      margin: 0;
      padding: 8px 10px;
      overflow-y: auto;
      flex: 1;
      overscroll-behavior: contain;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.85);
    }

    .playlist-item.active {
      background: rgba(232, 163, 61, 0.2);
      color: var(--marigold-bright);
      font-weight: 600;
      border-left: 3px solid var(--marigold-bright);
    }

    .playlist-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========================================================
       MOBILE & NARROW SCREEN OPTIMIZATIONS (<= 640px)
       ======================================================== */
    @media (max-width: 640px) {
      #offlinePlayer {
        grid-template-columns: 44px 1fr;
        grid-template-rows: auto auto;
        padding: 10px 14px;
        border-radius: 22px;
        gap: 8px 10px;
      }

      .offline-cover {
        width: 44px;
        height: 44px;
        font-size: 20px;
        grid-column: 1 / 2;
        grid-row: 1 / 2;
      }

      .offline-info {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
      }

      .offline-controls {
        grid-column: 1 / 3;
        grid-row: 2 / 3;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .offline-control-btn {
        width: 28px;
        height: 28px;
        font-size: 15px;
      }

      .offline-play-btn {
        width: 36px;
        height: 36px;
        font-size: 15px;
        margin: 0 2px;
      }

      .playlist-toggle-btn {
        width: 28px;
        height: 28px;
        font-size: 13px;
      }

      .offline-volume {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 2px;
      }

      .offline-volume-btn {
        width: 24px;
        height: 24px;
        font-size: 13px;
      }

      .offline-volume-slider {
        width: 38px;
        height: 3px;
      }

      .playlist-modal {
        bottom: calc(130px + var(--safe-bottom));
        width: 94vw;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <header class="top-bar">
      <div class="time-widget">
        <div class="time-main" id="currentTime">--:-- -- IST</div>
        <div class="date-sub" id="currentDate">--</div>
      </div>
    </header>

    <main class="logo-container">
      <h1 class="logo">छठ घाट</h1>
      <div class="tagline">॥ जय छठी मईया ॥</div>
    </main>

    <!-- PLAYER -->
    <div id="offlinePlayer">
      <div class="offline-cover">🌅</div>

      <div class="offline-info">
        <div class="offline-song-title" id="offlineSongName">Loading Geet...</div>
        <div class="offline-subtitle">छठ महापर्व</div>

        <div class="offline-progress-row">
          <span class="offline-time" id="currentSongTime">0:00</span>
          <input type="range" class="offline-progress" id="offlineProgress" min="0" max="100" step="0.1" value="0"
            title="Seek">
          <span class="offline-time" id="totalSongTime">0:00</span>
        </div>
      </div>

      <div class="offline-controls">
        <button class="playlist-toggle-btn" id="playlistToggleBtn" title="Geet Suchi (Playlist)" type="button"
          aria-label="Open Playlist">☰</button>
        <button class="offline-control-btn" id="prevSong" title="Previous" type="button"
          aria-label="Previous Song">⏮</button>
        <button class="offline-play-btn" id="offlinePlay" title="Play" type="button"
          aria-label="Play or Pause">▶</button>
        <button class="offline-control-btn" id="nextSong" title="Next" type="button" aria-label="Next Song">⏭</button>

        <div class="offline-volume">
          <button class="offline-volume-btn" id="muteBtn" title="Mute" type="button"
            aria-label="Mute Volume">🔊</button>
          <input type="range" class="offline-volume-slider" id="volumeSlider" min="0" max="100" value="100"
            title="Volume">
        </div>
      </div>

      <audio id="offlineAudio" preload="metadata"></audio>
    </div>

    <!-- PLAYLIST MODAL -->
    <div class="playlist-modal" id="playlistModal">
      <div class="playlist-header">
        <div class="playlist-title" id="playlistTitle">🎵 Chhath Geet List</div>
        <button class="playlist-close" id="playlistCloseBtn" aria-label="Close Playlist">✕</button>
      </div>
      <ul class="playlist-list" id="playlistList"></ul>
    </div>
  </div>

  <script>
    /* ========================================================
       DIMENSION-BASED RESPONSIVE BACKGROUND HANDLER
       ======================================================== */
    const imageBreakpoints = [
      { maxWidth: 400, src: "images/chhath_puja_400x838_new.png" },      // Mobile Small (<= 400px)
      { maxWidth: 540, src: "images/chhath_puja_540x838.png" },      // Mobile Regular / Large (<= 540px)
      { maxWidth: 780, src: "images/chhath_puja_780x838.png" },      // Tablet / Foldable (<= 780px)
      { maxWidth: 780, src: "images/chhath_puja_1180x838.png" },      // small laptop (<= 1180px)
      { maxWidth: Infinity, src: "images/ChatGPT Image Aug 14, 2026, 07_34_48 PM.png" } // Desktop / Large Screen (> 780px)
    ];

    // Fallback backgrounds in case individual breakpoint images are not found
    const fallbackBackgrounds = [
      "images/ChatGPT Image Aug 14, 2026, 07_34_48 PM.png",
      "images/ChatGPT Image Aug 14, 2026, 07_36_50 PM.png",
      "images/ChatGPT Image Aug 14, 2026, 07_43_15 PM.png",
      "images/chhath.png"
    ];

    const bgLayer = document.getElementById("bgLayer");
    let currentLoadedSrc = "";

    function applyResponsiveBackground() {
      const screenWidth = window.innerWidth;
      const target = imageBreakpoints.find(bp => screenWidth <= bp.maxWidth);

      if (target && target.src !== currentLoadedSrc) {
        const img = new Image();
        img.onload = () => {
          bgLayer.style.backgroundImage = `url("${encodeURI(target.src)}")`;
          currentLoadedSrc = target.src;
        };
        img.onerror = () => {
          // If custom dimension image isn't present, try fallbacks
          tryFallbackBackground(0);
        };
        img.src = target.src;
      }
    }

    function tryFallbackBackground(index) {
      if (index >= fallbackBackgrounds.length) return;
      const img = new Image();
      img.onload = () => {
        bgLayer.style.backgroundImage = `url("${encodeURI(fallbackBackgrounds[index])}")`;
        currentLoadedSrc = fallbackBackgrounds[index];
      };
      img.onerror = () => {
        tryFallbackBackground(index + 1);
      };
      img.src = fallbackBackgrounds[index];
    }

    // Initial background load
    applyResponsiveBackground();

    // Re-calculate background on window resize (Debounced)
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyResponsiveBackground, 200);
    });

    /* LIVE CLOCK */
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, "0");
      const suffix = hours >= 12 ? "pm" : "am";
      hours = hours % 12 || 12;

      const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      document.getElementById("currentTime").textContent = `${hours}:${minutes} ${suffix} IST`;
      document.getElementById("currentDate").textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* AUDIO PLAYER LOGIC */
    let songs = [];
    let currentSong = 0;
    let isSeeking = false;
    let lastVolume = 1;

    const offlineAudio = document.getElementById("offlineAudio");
    const songName = document.getElementById("offlineSongName");
    const playButton = document.getElementById("offlinePlay");
    const progress = document.getElementById("offlineProgress");
    const currentTime = document.getElementById("currentSongTime");
    const totalTime = document.getElementById("totalSongTime");
    const muteBtn = document.getElementById("muteBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const playlistToggleBtn = document.getElementById("playlistToggleBtn");
    const playlistCloseBtn = document.getElementById("playlistCloseBtn");
    const playlistModal = document.getElementById("playlistModal");
    const playlistList = document.getElementById("playlistList");
    const playlistTitle = document.getElementById("playlistTitle");

    async function loadOfflineSongs() {
      try {
        const response = await fetch("/songs");
        if (!response.ok) throw new Error("API error");
        songs = await response.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          songName.textContent = "Koi geet nahi mila";
          return;
        }

        playlistTitle.textContent = `🎵 Chhath Geet List (${songs.length})`;
        renderPlaylist();
        loadSong(0);
      } catch (error) {
        console.error("Songs fetch failed:", error);
        songName.textContent = "Songs load nahi ho sake";
      }
    }

    function renderPlaylist() {
      playlistList.innerHTML = songs.map((s, idx) => `
        <li class="playlist-item ${idx === currentSong ? 'active' : ''}" data-index="${idx}">
          <span>${idx + 1}.</span>
          <span class="playlist-item-name">${escapeHTML(s.name)}</span>
          ${idx === currentSong ? '<span>🔊</span>' : ''}
        </li>
      `).join('');

      playlistList.querySelectorAll(".playlist-item").forEach(item => {
        item.addEventListener("click", () => {
          const songIdx = parseInt(item.getAttribute("data-index"), 10);
          playSong(songIdx);
        });
      });
    }

    function formatTime(seconds) {
      if (!isFinite(seconds) || isNaN(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function loadSong(index) {
      if (!songs[index]) return;
      currentSong = index;
      offlineAudio.src = songs[index].file;
      songName.textContent = songs[index].name;
      currentTime.textContent = "0:00";
      totalTime.textContent = "0:00";
      progress.value = 0;
      renderPlaylist();
    }

    function playSong(index) {
      loadSong(index);
      offlineAudio.play().catch(err => {
        console.warn("Play blocked:", err);
        playButton.textContent = "▶";
      });
    }

    playButton.addEventListener("click", () => {
      if (offlineAudio.paused) {
        offlineAudio.play().catch(e => console.error("Play error:", e));
      } else {
        offlineAudio.pause();
      }
    });

    document.getElementById("prevSong").addEventListener("click", () => {
      currentSong = (currentSong - 1 + songs.length) % songs.length;
      playSong(currentSong);
    });

    document.getElementById("nextSong").addEventListener("click", () => {
      currentSong = (currentSong + 1) % songs.length;
      playSong(currentSong);
    });

    offlineAudio.addEventListener("loadedmetadata", () => {
      totalTime.textContent = formatTime(offlineAudio.duration);
    });

    offlineAudio.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      if (offlineAudio.duration && isFinite(offlineAudio.duration)) {
        progress.value = (offlineAudio.currentTime / offlineAudio.duration) * 100;
      }
      currentTime.textContent = formatTime(offlineAudio.currentTime);
    });

    progress.addEventListener("input", () => {
      if (!offlineAudio.duration) return;
      isSeeking = true;
      currentTime.textContent = formatTime((progress.value / 100) * offlineAudio.duration);
    });

    progress.addEventListener("change", () => {
      if (!offlineAudio.duration) return;
      offlineAudio.currentTime = (progress.value / 100) * offlineAudio.duration;
      isSeeking = false;
    });

    offlineAudio.addEventListener("play", () => playButton.textContent = "❚❚");
    offlineAudio.addEventListener("pause", () => playButton.textContent = "▶");
    offlineAudio.addEventListener("ended", () => {
      currentSong = (currentSong + 1) % songs.length;
      playSong(currentSong);
    });

    volumeSlider.addEventListener("input", () => {
      const vol = volumeSlider.value / 100;
      offlineAudio.volume = vol;
      muteBtn.textContent = vol === 0 ? "🔇" : vol < 0.5 ? "🔉" : "🔊";
    });

    muteBtn.addEventListener("click", () => {
      if (offlineAudio.volume > 0) {
        lastVolume = offlineAudio.volume;
        offlineAudio.volume = 0;
        volumeSlider.value = 0;
        muteBtn.textContent = "🔇";
      } else {
        offlineAudio.volume = lastVolume;
        volumeSlider.value = lastVolume * 100;
        muteBtn.textContent = lastVolume < 0.5 ? "🔉" : "🔊";
      }
    });

    playlistToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      playlistModal.classList.toggle("open");
    });

    playlistCloseBtn.addEventListener("click", () => {
      playlistModal.classList.remove("open");
    });

    document.addEventListener("click", (e) => {
      if (!playlistModal.contains(e.target) && e.target !== playlistToggleBtn) {
        playlistModal.classList.remove("open");
      }
    });

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadOfflineSongs();
  </script>
</body>

</html>
